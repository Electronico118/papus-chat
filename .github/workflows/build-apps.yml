name: Build Papus Chat apps

on:
  workflow_dispatch:

jobs:
  windows-installer:
    name: Build Windows installer
    runs-on: windows-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Prepare Electron app
        working-directory: desktop
        run: |
          npm install
          npm run build

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: Papus-Chat-Windows-Setup
          path: desktop/dist/*.exe
          if-no-files-found: error

  android-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Capacitor
        working-directory: android
        run: npm install

      - name: Create Android project
        working-directory: android
        run: npx cap add android

      - name: Synchronize Android project
        working-directory: android
        run: npx cap sync android

      - name: Generate Papus Chat launcher icons
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick
          mkdir -p /tmp/papus-icon
          # Create square launcher icons from the existing Papus Chat logo.
          # ImageMagick preserves the logo and pads/crops it to a square canvas.
          for spec in "mdpi 48" "hdpi 72" "xhdpi 96" "xxhdpi 144" "xxxhdpi 192"; do
            set -- $spec
            density="$1"
            size="$2"
            mkdir -p "android/android/app/src/main/res/mipmap-$density"
            convert papus-chat.png -resize "${size}x${size}" -background "#5865f2" -gravity center -extent "${size}x${size}" "android/android/app/src/main/res/mipmap-$density/ic_launcher.png"
            cp "android/android/app/src/main/res/mipmap-$density/ic_launcher.png" "android/android/app/src/main/res/mipmap-$density/ic_launcher_round.png"
          done

      - name: Build APK
        working-directory: android/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: Papus-Chat-Android-APK
          path: android/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
